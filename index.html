function line(a,b){let[x0,y0]=a,[x1,y1]=b;if(Math.abs(x1-x0)>=Math.abs(y1-y0))y1=y0;else x1=x0;const r=[],n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++)r.push([x0+Math.sign(x1-x0)*i,y0+Math.sign(y1-y0)*i]);return r.filter(([x,y])=>inb(x,y)&&!water[idx(x,y)]&&(occ[idx(x,y)]===0||occ[idx(x,y)]==='r'))}
/* ---------- input ---------- */
const P=new Map();let g2=null,moved=0,sp=null;const cv=R.domElement;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{g.dist*=1+Math.sign(e.deltaY)*.1;e.preventDefault()},{passive:false});
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});moved=0;
if(P.size===2){drag=null;marks([],1);const[a,b]=[...P.values()];g2={d:Math.hypot(a.x-b.x,a.y-b.y),a:Math.atan2(b.y-a.y,b.x-a.x),mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}
else if(P.size===1&&e.button===0){sp=cellOf(e.clientX,e.clientY);if(tool==='road'&&sp)drag={s:sp,cells:[]};if(tool==='demo'&&sp)demo(...sp)}});
cv.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);
if(!p){if(e.pointerType==='mouse'&&ghost){const q=cellOf(e.clientX,e.clientY);if(q){gx=q[0];gy=q[1];updGhost()}}return}
const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
if(P.size>=2&&g2){const[a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),an=Math.atan2(b.y-a.y,b.x-a.x),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;g.dist*=g2.d/d;g.yaw+=an-g2.a;pan(mx-g2.mx,my-g2.my);g2={d,a:an,mx,my};return}
if(p.b===2){g.yaw-=dx*.008;g.pitch+=dy*.006;return}
const q=cellOf(e.clientX,e.clientY);
if(drag&&q){drag.cells=line(drag.s,q);const pl=plan(drag.cells);marks(drag.cells.concat(pl.cs2),City.money>=pl.cost);return}
if(tool==='demo'&&q&&moved>3){demo(...q);return}
if(pend&&q&&moved>3&&e.pointerType!=='mouse'){gx=q[0];gy=q[1];updGhost();return}
if(moved>5&&e.pointerType!=='mouse'||(e.pointerType==='mouse'&&p.b===0&&!pend&&tool!=='demo'))pan(dx,dy)});
function up(e){const p=P.get(e.pointerId);P.delete(e.pointerId);if(P.size<2)g2=null;if(!p)return;
if(drag){const pl=plan(drag.cells);if(pl.cost>City.money)toast(T('nomoney'));else if(pl.n.length){City.money-=pl.cost;layRoad(drag.cells,pl.dd,curRoad);if(pl.cs2.length)layRoad(pl.cs2,(pl.dd+2)%4,4);touchRoad();save();hud();tut()}drag=null;marks([],1);return}
if(moved<8&&p.b===0&&P.size===0){const q=cellOf(e.clientX,e.clientY);if(!q)return;if(pend){gx=q[0];gy=q[1];updGhost()}else if(tool==='build'&&inb(...q)){infoAt(...q)}}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
/* ---------- HUD, tutorial, save ---------- */
let lastH='';function hud(){const k=[City.money,City.pop,City.jobs,City.inc,City.exp,gameTime.day,gameTime.minutes|0].join();if(k===lastH)return;lastH=k;$('money').textContent=fmt(City.money);$('pop').textContent=City.pop;$('jobs').textContent=City.jobs;const b=City.inc-City.exp;$('bal').textContent=(b>=0?'+':'')+fmt(b)+T('perday');$('day').textContent=fmtTime()}
let ts=0,tutT=0;
function tut(){const a=[...bl.values()];ts=roadList.length<3?0:!a.some(b=>b.def.cat==='res')?1:!a.some(b=>b.def.cat==='com')?2:a.some(b=>b.state==='UNDER_CONSTRUCTION')?3:City.pop<1?4:5;$('tut').textContent=T('tut'+ts);if(ts===5){if(!tutT)tutT=setTimeout(()=>$('tut').style.opacity=0,9000)}else $('tut').style.opacity=1}
const KEY='civora_save_v2';function save(){try{localStorage.setItem(KEY,JSON.stringify({v:3,m:City.money,lv:City.level,gt:gameTime,r:roadList.map(([x,y])=>[x,y,rtype[idx(x,y)],rdir[idx(x,y)],rlink[idx(x,y)]]),b:[...bl.values()].map(b=>[b.k,b.x,b.y,b.rot,b.state,b.prog,b.occ]),s:S}))}catch(e){}}
function load(){let raw=null;try{raw=localStorage.getItem(KEY);if(!raw)return false;const s=JSON.parse(raw);s.r=Array.isArray(s.r)?s.r:[];s.b=Array.isArray(s.b)?s.b:[];City.money=s.m??30000;City.level=s.lv||1;const q=s.gt||{day:s.day||1,minutes:480};gameTime.day=q.day||1;gameTime.minutes=q.minutes??480;Object.assign(S,s.s||{});applyQ();
s.r.forEach(([x,y,t,d,l])=>{if(inb(x,y)){const i=idx(x,y);occ[i]='r';rtype[i]=RT[t]&&t<5?t:0;rdir[i]=d||0;rlink[i]=l==null?255:l;hideTrees(i)}});for(let k=0;k<N*N;k++)if(occ[k]==='r'){const x=k%N,y=k/N|0;D.forEach((d,j)=>{if(!isRoad(x+d[0],y+d[1]))rlink[k]&=~(1<<j)})}touchRoad();
s.b.forEach(([k,x,y,r,st,p,o])=>{if(DEFS[k]&&canPlace(k,x,y,r))addB(k,x,y,r,0,st,p,o)});return true}catch(e){console.error(e);if(raw)try{localStorage.setItem(KEY+'_bad',raw)}catch(_){}reset();toast("Saqlangan loyiha ma’lumotlarini o‘qib bo‘lmadi.");return false}}
function reset(){bl.forEach((b,id)=>delB(id));for(let i=0;i<N*N;i++)if(occ[i]==='r'){occ[i]=0;showTrees(i)}rm.forEach(o=>scene.remove(o));rm.clear();roadList=[];rtype.fill(0);rdir.fill(0);rlink.fill(0);City.money=30000;City.level=1;gameTime.day=1;gameTime.minutes=480}
let has=false;try{has=!!localStorage.getItem(KEY)}catch(e){}
if(has){$('contb').style.display='flex';load()||seed()}else seed();g.pitch=.62;g.dist=24;
function begin(){City.started=true;$('start').style.opacity=0;setTimeout(()=>$('start').remove(),700);g.pitch=.95;g.dist=26;g.tx=g.tz=0;setTool('build');hud();tut()}
$('newb').onclick=()=>{reset();seed();save();begin()};$('contb').onclick=begin;
const setEl=$('set');function applyQ(){R.setPixelRatio(S.q?Math.min(devicePixelRatio,2):1);R.setSize(innerWidth,innerHeight);sun.castShadow=!!S.q}
function setUI(){setEl.innerHTML='<b>'+T('set')+'</b><button data-a="q">'+T('gfx')+': '+T(S.q?'hi':'lo')+'</button><button data-a="c">'+T('cyc')+': '+T(S.cyc?'on':'off')+'</button><button data-a="s">'+T('cams')+': '+S.cam+'×</button><button>'+T('lang')+': '+T('uz')+'</button><button data-a="f">To‘liq ekran</button><button class="p" data-a="x">'+T('close')+'</button>'}
setEl.onclick=e=>{const b=e.target.closest('button'),a=b&&b.dataset.a;if(a==='q'){S.q^=1;applyQ()}if(a==='c')S.cyc^=1;if(a==='f')goFull();if(a==='s')S.cam=S.cam===1?1.5:S.cam===1.5?.6:1;if(a==='x'){setEl.style.display='none';save();return}if(a)setUI()};
$('gear').onclick=$('setb').onclick=()=>{setUI();setEl.style.display='flex'};
setInterval(save,8000);addEventListener('pagehide',save);
/* ---------- loop ---------- */
const clock=new THREE.Clock();function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let wt0=0,ht=0;function frame(){const dt=Math.min(clock.getDelta(),.05);if(!City.started)g.yaw+=dt*.06;order.forEach(n=>Systems[n].update(dt));hud();if((ht+=dt)>.5){ht=0;if(selCell)infoAt(...selCell);if(City.started)tut()}camUpdate(dt);if((wt0+=dt)>.06){animWater(clock.elapsedTime);wt0=0}R.render(scene,cam);requestAnimationFrame(frame)}
function goFull(){try{const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;if(f&&!document.fullscreenElement&&!document.webkitFullscreenElement){const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}},p=f.call(d);p&&p.then?p.then(lock).catch(()=>{}):lock()}}catch(e){}}
['click','touchend'].forEach(ev=>addEventListener(ev,goFull,{once:true}));
document.addEventListener('fullscreenchange',()=>setTimeout(resize,100));
addEventListener('beforeunload',e=>{if(City.started){save();e.preventDefault();e.returnValue=''}});
/* ---------- GLB model yuklash (assets/models/*.glb); fayl bo'lmasa eski usulda ishlaydi ---------- */
const MD={};
function prep(gl,h){const o=gl.scene,b=new THREE.Box3().setFromObject(o),k=h/(b.getSize(new THREE.Vector3()).y||1);o.scale.multiplyScalar(k);b.setFromObject(o);const c=b.getCenter(new THREE.Vector3());o.position.set(-c.x,-b.min.y,-c.z);const w=new THREE.Group();w.add(o);w.traverse(m=>{if(m.isMesh){m.castShadow=m.receiveShadow=true}});return w}
const nearW=(x,y)=>{for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++)if(inb(x+a,y+b)&&water[idx(x+a,y+b)])return true;return false};
function scatter(m,n,near){let k=0;for(let t=0;t<900&&k<n;t++){const x=Math.random()*N|0,y=Math.random()*N|0,i=idx(x,y);if(water[i]||occ[i]!==0||Math.hypot(x-20,y-20)<4||(near&&!nearW(x,y)))continue;const o=m.clone();o.scale.setScalar(.7+Math.random()*.7);o.rotation.y=Math.random()*6.28;o.position.set(cw(x)+(Math.random()-.5)*.6,0,cw(y)+(Math.random()-.5)*.6);scene.add(o);(trees[i]=trees[i]||[]).push(o);k++}}
async function loadModels(){if(!THREE.GLTFLoader)return;const GL=new THREE.GLTFLoader(),L={oak:['tree_oak_1',1.1],pine:['tree_pine_1',1.3],bush:['bush_1',.4],rock:['rock_1',.3]};
for(const k in L){const g=await new Promise(r=>GL.load('assets/models/'+L[k][0]+'.glb',r,undefined,()=>r(null)));if(g)MD[k]=prep(g,L[k][1])}
const T=[MD.oak,MD.pine].filter(Boolean);if(T.length)trees.forEach(a=>a&&a.forEach(g=>{g.clear();g.add(T[Math.random()*T.length|0].clone())}));
if(MD.bush)scatter(MD.bush,70,false);if(MD.rock)scatter(MD.rock,35,true)}
setTool('build');frame();loadModels();
